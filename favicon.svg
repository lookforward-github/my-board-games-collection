<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Тот же d20, что в шапке сайта. Заливка акцентным цветом, чтобы иконка
       читалась и на светлой, и на тёмной вкладке браузера. -->
  <polygon points="50,4 92,28 92,72 50,96 8,72 8,28"
           fill="#d99a6c" stroke="#8a4b2a" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="50,20 76,35 76,65 50,80 24,65 24,35"
           fill="none" stroke="#8a4b2a" stroke-width="4" stroke-linejoin="round" opacity=".55"/>
  <path d="M50,4 L50,20 M92,28 L76,35 M92,72 L76,65 M50,96 L50,80 M8,72 L24,65 M8,28 L24,35"
        stroke="#8a4b2a" stroke-width="4" opacity=".45"/>
  <text x="50" y="55" text-anchor="middle" font-size="30" font-weight="700"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        fill="#3a2a1e">20</text>
</svg>
